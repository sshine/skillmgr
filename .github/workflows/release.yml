name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5, 2026-11-11
        with:
          # The runner image has /run/systemd/system but no working systemd, so
          # the daemon install leaves a root-owned store the job cannot use.
          # Single-user matches what cache-nix-action and the old installer did.
          install_options: --no-daemon
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Gate the release on the same checks CI runs, so a tag can never publish
      # something that would have failed on main.
      - name: Build, test and lint
        run: nix develop -c just ci

      # `just dist` asserts the tag matches the version cargo would publish.
      - name: Build static musl artifacts
        run: nix develop -c just dist "${GITHUB_REF_NAME}"

      # A smoke test on the artifact that will actually be shipped, not on a
      # host-native build that might differ.
      - name: Smoke-test the x86_64 binary
        run: |
          tar -xzf "dist/skillmgr-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C /tmp
          /tmp/skillmgr --version
          /tmp/skillmgr --help

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4, 2026-11-05
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
